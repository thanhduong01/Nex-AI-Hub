}<div class="message-body"><div class="message-author"><strong>${pr.name}</strong>${pill(pr.mode)}<time>09:24</time></div><div class="ai-message"><p>Dưới đây là khung phân tích để đội ngũ bắt đầu nghiên cứu. Các nội dung trong bản này là <strong>ví dụ minh họa cho giao diện</strong>, cần được kiểm chứng bằng dữ liệu thực tế.</p><h3>1. Bắt đầu từ vấn đề của khách hàng</h3><p>Tập trung vào tình huống sử dụng và kết quả khách hàng mong muốn, trước khi lựa chọn tính năng sản phẩm.</p><div class="table-wrap"><table class="data-table compact no-wide"><thead><tr><th>Góc nhìn</th><th>Câu hỏi cần làm rõ</th></tr></thead><tbody><tr><td><strong>Nhu cầu</strong></td><td>Vấn đề nào xuất hiện thường xuyên?</td></tr><tr><td><strong>Trải nghiệm</strong></td><td>Điều gì khiến giải pháp hiện tại khó sử dụng?</td></tr><tr><td><strong>Quyết định mua</strong></td><td>Khách hàng cần bằng chứng gì để tin tưởng?</td></tr></tbody></table></div><h3>2. Ba hướng để kiểm chứng</h3><ul><li><strong>Phỏng vấn khách hàng:</strong> tìm hiểu một tình huống gần nhất, cách họ đã xử lý và điều còn chưa hài lòng.</li><li><strong>Đối chiếu phản hồi:</strong> nhóm các nhận xét theo vấn đề, tần suất và mức độ ảnh hưởng.</li><li><strong>Thử một giải pháp nhỏ:</strong> dùng phản hồi trực tiếp để điều chỉnh trước khi mở rộng.</li></ul><blockquote>Gợi ý tiếp theo: chọn một nhóm khách hàng cụ thể và xây dựng bộ 5 câu hỏi phỏng vấn.</blockquote><div class="sources">${['Tổng quan nghiên cứu.pdf','Phản hồi khách hàng.xlsx'].map((name,i)=>`<button class="source" data-action="file-preview" data-id="${i}"><span class="source-num">${i+1}</span>${name}${icon('external')}</button>`).join('')}</div><p class="tiny muted">Tài liệu và trích dẫn minh họa trong prototype.</p></div><div class="message-actions">${ib('copy','Sao chép phản hồi mẫu','copy-answer')}${ib('thumb','Đánh dấu hữu ích','like')}${!readonly?ib('refresh','Thử lại phản hồi mẫu','retry'):''}${ib('branch','Tạo nhánh với AI khác','branch',`data-id="${p.id}"`)}<span class="meta">${pr.name} · 1.240 token · $0.012 mẫu</span></div></div></article>`:''}${(S.newMessages[key]||[]).map(m=>`<article class="message">${m.kind==='user'?avatar(me().id):symbol(S.provider)}<div class="message-body"><div class="message-author"><strong>${m.kind==='user'?me().name:provider(S.provider).name}</strong><time>Vừa xong · Mô phỏng</time></div><div class="${m.kind==='user'?'user-message':'ai-message'}">${esc(m.text).replace(/\n/g,'<br>')}</div></div></article>`).join('')}${S.busy?`<div class="message">${symbol(S.provider)}<div class="message-body"><div class="message-author"><strong>Đang hiển thị phản hồi mẫu</strong></div><div class="typing"><span></span><span></span><span></span></div></div></div>`:''}</div><div class="chat-composer"><label for="chat-prompt" class="sr-only">Nội dung tin nhắn</label><textarea id="chat-prompt" placeholder="${readonly?'Bạn đang ở chế độ chỉ xem':exhausted?'Ngân sách đã hết — tin nhắn mới tạm dừng':'Tiếp tục trao đổi hoặc đặt một câu hỏi...'}" ${readonly||exhausted?'disabled':''}>${esc(S.draft||'')}</textarea><div class="composer-controls"><div class="row gap6"><button class="composer-model" data-action="models" ${readonly?'disabled':''}>${symbol(isNew?S.provider:pr.id)}${isNew?provider(S.provider).name:pr.name}${icon('down')}</button>${ib('paperclip','Chọn tài liệu mẫu','attach',readonly?'disabled':'')}</div><button class="send-button" data-action="${S.busy?'stop':'send'}" data-id="${key}" aria-label="${S.busy?'Dừng mô phỏng':'Gửi tin nhắn mẫu'}" ${readonly||exhausted?'disabled':''}>${icon(S.busy?'stop':'up')}</button></div></div><p class="composer-foot">${iconInlineShield()} Nội dung mô phỏng, không gửi tới AI. Chủ doanh nghiệp có quyền xem dự án công việc.</p></section><aside class="panel context-panel"><div class="section"><div class="row between"><h3>Ngữ cảnh hội thoại</h3>${icon('file')}</div><p>Những thông tin được dùng cho lượt trao đổi này.</p><div class="context-label">DỰ ÁN</div><a href="#/project/${p.id}" function importsPage(){const step=S.importStep;return `${heading('Nhập dữ liệu','Đưa những hội thoại có giá trị về cùng không gian công việc.')}<div class="steps">${[[1,'Chọn nguồn'],[2,'Xem trước & phân loại'],[3,'Kết quả']].map(([n,label],i)=>`${i?'<div class="step-line"></div>':''}<div class="step ${step===n?'active':step>n?'done':''}"><span class="step-num">${step>n?'✓':n}</span>${label}</div>`).join('')}</div>${step===3?`<section class="panel success-panel"><div class="success-symbol">${icon('check')}</div><h2>Đã hoàn tất bản xem trước</h2><p>Đây là kết quả nhập dữ liệu mô phỏng. Không có tệp thật được tải lên hoặc lưu.</p><div class="result-metrics"><div><strong>8</strong><span>Hội thoại đã nhập</span></div><div><strong>2</strong><span>Bản trùng được bỏ qua</span></div><div><strong>1</strong><span>Cần xem lại</span></div></div>${notice('Một hội thoại thiếu tệp đính kèm. Nội dung văn bản vẫn được giữ trong ví dụ mẫu.','amber')}<div class="row" style="justify-content:center">${btn('Nhập nguồn khác','import-reset','upload')}${btn('Mở kho hội thoại','navigate','arrow','primary','data-path="library"')}</div></section>`:`<div class="import-grid"><section class="panel panel-padding">${step===1?`<h2>Hội thoại của bạn đang ở đâu?</h2><p class="small muted mt12">Chọn nền tảng đã xuất dữ liệu để xem cách nhập vào Hub.</p><div class="source-options">${NEX.providers.slice(0,3).map(p=>`<button class="source-option ${S.importProvider===p.id?'active':''}" data-action="import-provider" data-id="${p.id}">${symbol(p.id)}${p.id==='openai'?'ChatGPT':p.name}</button>`).join('')}</div><div class="drop-zone">${icon(S.importReady?'check':'upload')}<strong>${S.importReady?'conversations-demo.json':'Chọn dữ liệu để xem trước'}</strong><p>${S.importReady?'11 hội thoại · 128 KB · Tệp minh họa':'JSON hoặc ZIP export từ nền tảng được hỗ trợ'}</p><button class="btn ${S.importReady?'soft':'primary'} mt12" data-action="sample-file">${S.importReady?'Đã chọn dữ liệu mẫu':'Dùng tệp mẫu'}</button> iv>`}`;}
function settingsPage(){const owner=S.role==='owner';return `${heading('Cài đặt','Điều chỉnh không gian làm việc theo cách đội ngũ của bạn hoạt động.')}<div class="settings-grid"><nav class="settings-nav" aria-label="Mục cài đặt">${(owner?[['workspace','Không gian làm việc'],['access','Quyền & hiển thị'],['notifications','Thông báo'],['profile','Hồ sơ của tôi']]:[['profile','Hồ sơ của tôi'],['notifications','Thông báo']]).map(([id,label])=>`<button class="${(owner?S.settingsTab:(S.settingsTab==='workspace'?'profile':S.settingsTab))===id?'active':''}" data-action="settings-tab" data-id="${id}">${label}</button>`).join('')}</nav><section class="settings-content">${S.settingsTab==='access'&&owner?`<div class="panel panel-padding"><h2>Quyền xem dự án</h2><p class="small muted mt12">Chính sách được áp dụng cho mọi dự án công việc.</p>${notice('Chủ doanh nghiệp xem toàn bộ dự án công việc. Nhân viên chỉ thấy dự án của mình và dự án được chia sẻ.')}<div class="settings-row"><div><strong>Thông báo quyền xem cho nhân viên</strong><p>Hiển thị khi tạo và chia sẻ dự án.</p></div>${pill('Luôn bật','green')}</div><div class="settings-row"><div><strong>Quyền xem tách khỏi quyền đóng góp</strong><p>Quyền đọc không tự cấp quyền gửi tin nhắn hoặc sửa.</p></div>${pill('Đang áp dụng','green')}</div><div class="settings-row"><div><strong>Ghi nhận truy cập và xuất dữ liệu</strong><p>Actor, hành động, tài nguyên và thời điểm.</p></div><a class="text-link" href="#/audit">Xem nhật ký ${icon('arrow')}</a></div></div>`:S.settingsTab==='notifications'?`<div class="panel panel-padding"><h2>Thông báo</h2>${[['Cảnh báo ngân sách','Khi sử dụng đến các ngưỡng được cấu hình.'],['Thay đổi quyền dự án','Khi bạn được thêm hoặc thay đổi quyền.'],['Kết quả nhập dữ liệu','Khi hoàn tất bản nhập hoặc có dữ liệu cần xem lại.']].map(([t,d])=>`<div class="settings-row"><div><strong>${t}</strong><p>${d}</p></div><button class="switch on" data-action="toggle" role="switch" aria-checked="true" aria-label="${t}"></button></div>`).join('')}</div>`:`<div class="panel panel-padding"><h2>${S.settingsTab==='profile'||!owner?'Hồ sơ của tôi':'Thông tin không gian làm việc'}</h2><div class="row mt24 mb24">${S.settingsTab==='profile'||!owner?avatar(me().id,'lg'):'<span class="workspace-logo" style="width:46px;height:46px;font-size:19px">N</span>'}<div><strong>${S.settingsTab==='profile'||!owner?me().name:'NexMO Workspace'}</strong><p class="tiny muted">${S.settingsTab==='profile'||!owner?me().job:'Không gian nội bộ · 6 thành viên'}</p></div></div><form id="settings-form"><div class="field"><label for="settings-name">${S.settingsTab==='profile'||!owner?'Họ và tên':'Tên không gian'}</label><input id="settings-name" class="input" value="${S.settingsTab==='profile'||!owner?me().name:'NexMO Workspace'}"></div><div class="form-grid"><div class="field"><label for="settings-language">Ngôn ngữ</label><select id="settings-language" class="input"><option>Tiếng Việt</option><option>English</option></select></div><div class="field"><label for="settings-zone">Múi giờ</label><select id="settings-zone" class="input"><option>Việt Nam (UTC+7)</option></select></div></div>${btn('Lưu bản xem trước','save-settings','','primary')}</form></div>`}<p class="tiny muted mt12">Thay đổi chỉ mô phỏng trong phiên xem prototype.</p></section></div>`;}
function auditPage(){const events=[['owner','Mở hội thoại','Phân tích khách hàng','eye','09:42'],['linh','Tạo hội thoại','Nghiên cứu thị trường','chat','09:24'],['owner','Điều chỉnh hạn mức','Nhân viên Linh Nguyễn','wallet','09:10'],['huy','Chia sẻ dự án','Nội dung tháng 11','people','08:55'],['owner','Xem kết quả nhập','ChatGPT · 11 hội thoại mẫu','upload','08:40'],['anh','Xuất hội thoại','Phân tích khách hàng','download','Hôm qua']];return `${heading('Nhật ký hoạt động','Theo dõi truy cập, thay đổi quyền và các thao tác quản trị.')}<div class="toolbar"><div class="tabs"><button class="tab active">Tất cả hoạt động</button></div>${btn('Bộ lọc','audit-filter','filter')}</div><div class="table-wrap"><table class="data-table"><thead><tr><th>Người thực hiện</th><th>Hành động</th><th>Tài nguyên</th><th>Thời gian mẫu</th></tr></thead><tbody>${events.map(([uid,action,resource,ic,time])=>`<tr><td><div class="row">${avatar(uid)}${person(uid).name}</div></td><td><span class="audit-action">${icon(ic)}${action}</span></td><td>${resource}</td><td class="muted">${time}</td></tr>`).join('')}</tbody></table></div>${notice('Nhật ký lưu hành động và tài nguyên liên quan. Nội dung câu hỏi và khóa API không được sao chép vào log.')}`;}
function loginPage(){return `<main class="login-page" id="main"><section class="login-art"><div class="brand">${mark()}<span>nex ai hub</span></div><h1>Một không gian.<br>Mọi ý tưởng.</h1><p>Kết nối những AI bạn cần và giữ tri thức của đội ngũ ở cùng một nơi.</p><div class="orbital"><div class="orbit"></div><div class="orbit second"></div>${mark()}<span class="orbit-provider">O</span><span class="orbit-provider">C</span><span class="orbit-provider">G</span><span class="orbit-provider">M</span></div><footer>NexMO Workspace · Không gian làm việc nội bộ</footer></section><section class="login-form"><h2>Chào mừng trở lại.</h2><p>Đăng nhập vào không gian làm việc của bạn.</p><form id="login-form"><div class="field"><label for="login-email">Email công việc</label><input class="input" id="login-email" type="email" autocomplete="username" value="${me().email}" required></div><div class="field"><div class="row between"><label for="login-password">Mật khẩu</label><button type="button" class="text-link" data-action="forgot">Quên mật khẩu?</button></div><input class="input" id="login-password" type="password" autocomplete="current-password" value="prototype-demo" required><span class="hint">Dữ liệu mẫu — không nhập thông tin đăng nhập thật.</span></div><button type="submit" class="btn primary large full">Vào không gian làm việc ${icon('arrow')}</button></form><div class="divider"></div><div class="eyebrow">CHỌN VAI TRÒ ĐỂ XEM THỬ</div><div class="demo-login-roles"><button class="demo-login-role ${S.role==='owner'?'active':''}" data-action="login-role" data-id="owner">${avatar('owner')}<span>Chủ doanh nghiệp</span></button><button class="demo-login-role ${S.role==='employee'?'active':''}" data-action="login-role" data-id="employee">${avatar('linh')}<span>Nhân viên</span></button></div><div class="prototype-label">PROTOTYPE · KHÔNG XÁC THỰC TÀI KHOẢN THẬT</div></section></main>`;}

</script>
<script>
function modal(title,description,body,footer='',wide=false){
  const d=$('#modal');d.innerHTML=`<div class="modal-head"><div><h2 id="modal-title">${title}</h2>${description?`<p>${description}</p>`:''}</div>${ib('close','Đóng hộp thoại','close-modal')}</div><div class="modal-body">${body}</div>${footer?`<div class="modal-footer">${footer}</div>`:''}`;
  d.style.width=wide?'min(700px, calc(100% - 32px))':'min(540px, calc(100% - 32px))';if(!d.open)d.showModal();
}
function closeModal(){$('#modal').close();}
function guide(){
  const screens=[['overview','Tổng quan','grid'],['projects','Danh sách dự án','folder'],['project/p1','Chi tiết dự án','folder'],['chat/c1','Hội thoại AI','chat'],['chat/new','Hội thoại mới','plus'],['library','Kho hội thoại','library'],['integrations','Nguồn AI & tài khoản','plug'],['team','Nhân viên','people'],['usage','Chi phí & ngân sách','chart'],['imports','Nhập lịch sử','upload'],['audit','Nhật ký hoạt động','activity'],['settings','Cài đặt & quyền','settings'],['login','Đăng nhập','lock']];
  modal('Khám phá prototype','Giao diện chi tiết · Dữ liệu mẫu · Không gọi API thật',`<div class="screen-map">${screens.filter(([r])=>S.role==='owner'||!['integrations','team','imports','audit'].includes(r)).map(([path,label,ic])=>`<button data-action="navigate" data-path="${path}">${icon(ic)}${label}</button>`).join('')}</div><div class="divider"></div><h3>Xem các trạng thái giao diện</h3><p class="small muted mt12">Chọn một trạng thái để kiểm tra cách hệ thống phản hồi.</p><div class="row wrap mt12">${[['normal','Bình thường'],['empty','Dữ liệu trống'],['loading','Đang tải'],['error','Lỗi kết nối'],['budget','Hết ngân sách'],['readonly','Chỉ xem']].map(([id,label])=>btn(label,'demo-state','','',`data-id="${id}"`)).join('')}</div><div class="info-banner">${icon('info')}Tên, email, số tiền và phản hồi đều là dữ liệu minh họa. Thao tác chỉ thay đổi giao diện trong phiên xem; tải lại trang để khôi phục.</div>`,btn('Tiếp tục khám phá','close-modal','','primary'),true);
}
function newProject(){modal('Tạo dự án mới','Một không gian riêng để giữ công việc theo đúng mục tiêu.',`<form id="new-project-form"><div class="field"><label for="project-name">Tên dự án <span class="red">*</span></label><input class="input" id="project-name" placeholder="Ví dụ: Nghiên cứu sản phẩm mới" maxlength="70" required><span class="hint">Tên rõ ràng giúp đội ngũ tìm lại công việc dễ hơn.</span></div><div class="field"><label for="project-description">Mô tả</label><textarea class="input" id="project-description" placeholder="Mục tiêu và phạm vi của dự án..." maxlength="250"></textarea></div><div class="field"><label for="project-category">Phân loại</label><select class="input" id="project-category"><option>Nghiên cứu</option>Marketing</option>Thương hiệu</option>Vận hành</option>Sản phẩm</option></select></div>${notice('Dự án công việc — chủ doanh nghiệp có quyền xem nội dung. Bạn có thể chia sẻ với thành viên sau khi tạo.')}<p class="tiny muted">Đây là thao tác mô phỏng, không tạo dữ liệu trên máy chủ.</p></form>`,btn('Hủy','close-modal')+btn('Tạo dự án mẫu','create-project','plus','primary'));}
function shareProject(id){const p=project(id),isManager=p.owner===me().id;modal(isManager?'Chia sẻ dự án':'Quyền truy cập dự án',p.name,`${notice('Chủ doanh nghiệp luôn có quyền xem dự án công việc. Quyền đóng góp được quản lý riêng.')}${[p.owner,...p.members].map(uid=>`<div class="file-row">${avatar(uid)}<div class="file-info"><strong>${person(uid).name}</strong><p>${person(uid).email}</p></div>${uid===p.owner?pill('Chủ dự án','green'):isManager?`<select class="select" data-member-right="${uid}" aria-label="Quyền của ${person(uid).name}"><option ${!p.write.includes(uid)?'selected':''}>Chỉ xem</option><option ${p.write.includes(uid)?'selected':''}>Đóng góp</option></select>`:pill(p.write.includes(uid)?'Đóng góp':'Chỉ xem')}</div>`).join('')}${isManager?`<div class="field mt24"><label for="share-member">Thêm thành viên</label><select class="input" id="share-member"><option value="">Chọn thành viên trong công ty</option>${NEX.people.filter(u=>u.id!==p.owner&&!p.members.includes(u.id)).map(u=>`<option value="${u.id}">${u.name}</option>`).join('')}</select></div><p class="tiny muted">Quyền “Chỉ xem” cho phép đọc nội dung. Quyền “Đóng góp” cho phép tiếp tục trao đổi và thêm nội dung.</p>`:'<p class="small muted mt24">Bạn có quyền xem. Việc thay đổi thành viên cần chủ dự án hoặc người được ủy quyền.</p>'}`,btn('Đóng','close-modal')+(isManager?btn('Xem trước chia sẻ','share-save','people','primary',`data-id="${id}"`):''));}
function modelPicker(branch=false,projectId='p1'){modal(branch?'Tiếp tục bằng AI khác':'Chọn nguồn AI',branch?'Hub tạo một nhánh mới và giữ nguyên hội thoại gốc.':'Chọn kết nối được cấp quyền trong không gian làm việc.',`${NEX.providers.map(p=>`<button class="modal-option ${p.id===S.provider?'selected':''}" data-action="${branch?'branch-model':'model-select'}" data-id="${p.id}" data-project="${projectId}" ${p.id==='meta'?'disabled':''}>${symbol(p.id,true)}<span class="grow"><strong>${p.name} · ${p.mode}</strong><p>${p.hint}</p></span>${p.id===S.provider?icon('check'):p.id==='meta'?pill('Chờ xác minh','amber'):icon('chevron')}</button>`).join('')}${branch?notice('Chỉ phần ngữ cảnh được chọn của hội thoại này sẽ được gửi sang nguồn AI mới. Trong prototype, thao tác chỉ mở một màn hình mẫu.'):'<p class="tiny muted mt12">Tên model và hạn mức thật được cấu hình khi kết nối. Các lựa chọn này mô tả trải nghiệm mẫu.</p>'}`,btn('Hủy','close-modal'));}
function connectModal(id='openai'){const p=provider(id);modal('Thiết lập kết nối AI','Chỉ chủ doanh nghiệp quản lý khóa và quyền sử dụng.',`<div class="field"><label for="connect-provider">Nhà cung cấp</label><select class="input" id="connect-provider">${NEX.providers.map(pr=>`<option value="${pr.id}" ${pr.id===id?'selected':''}>${pr.name}</option>`).join('')}</select></div><div class="field"><label for="connection-name">Tên kết nối</label><input class="input" id="connection-name" value="NexMO · ${p.name}"></div><div class="field"><label for="connection-key">API key</label><input class="input mono" id="connection-key" value="•••• •••• •••• DEMO" readonly><span class="hint">Khóa giả chỉ để xem giao diện. Không nhập khóa thật vào prototype.</span></div><div class="field"><label>Quyền sử dụng</label><div class="row wrap">${NEX.people.filter(u=>u.id!=='owner').map(u=>`<label class="check-field"><input type="checkbox" checked>${u.name.split(' ')[0]}</label>`).join('')}</div></div>${notice('Một kết nối chung, ngữ cảnh riêng cho từng hội thoại. Nhân viên không thấy API key.')}`,btn('Hủy','close-modal')+btn('Kiểm tra mẫu','test-connection','plug','primary',`data-id="${id}"`));}
function providerDetail(id){const p=provider(id);if(id==='meta'){modal('Meta AI — trạng thái tích hợp','Chưa xác minh quyền truy cập API.',`<div class="row">${symbol(id,true)}<div><h3>Meta AI Free</h3><p class="small muted">Tài khoản hiện có trong danh mục</p></div></div>${notice('Tài khoản website không tự cấp quyền API. Chưa thể bật chat trực tiếp với Meta trong bản thiết kế này.','amber')}<div class="check-list"><div>${icon('check')}Quản lý thông tin tài khoản</div><div>${icon('check')}Lưu nội dung được nhập thủ công</div><div>${icon('clock')}Kiểm chứng API, model và hạn mức trước tích hợp</div></div>`,btn('Đã hiểu','close-modal','','primary'));return;}modal(`Kết nối ${p.name}`,'NexMO · Kết nối mẫu của công ty',`<div class="row between">${symbol(id,true)}${pill('Kết nối mẫu hoạt động','green dot')}</div><div class="definition"><div class="definition-row"><span>Loại kết nối</span><strong>API tập trung</strong></div><div class="definition-row"><span>Model mẫu</span><strong>${p.mode}</strong></div><div class="definition-row"><span>Quyền sử dụng</span><strong>5 nhân viên + Owner</strong></div><div class="definition-row"><span>Chi phí tháng mẫu</span><strong>${money(p.cost)}</strong></div></div><div class="provider-key">${icon('key')}•••• •••• •••• DEMO</div>${notice('Trạng thái minh họa. Chưa có API key hay kết nối thật trong prototype.')}`,btn('Đóng','close-modal')+btn('Chỉnh cấu hình mẫu','connect','settings','primary',`data-id="${id}"`));}
function employeeModal(id){const p=person(id);modal(p.name,'Quyền sử dụng AI và hạn mức cá nhân',`<div class="row">${avatar(id,'lg')}<div><h3>${p.job}</h3><p class="small muted">${p.email}</p></div></div><div class="divider"></div><h3>Nguồn AI được sử dụng</h3><div class="check-list">${NEX.providers.slice(0,3).map(pr=>`<label class="check-field"><input type="checkbox" checked>${symbol(pr.id)}${pr.name}</label>`).join('')}</div><div class="field mt24"><label for="employee-budget">Hạn mức tháng · USD mẫu</label><input class="input" id="employee-budget" type="number" min="1" value="${p.limit}"><span class="hint">Đã sử dụng ${money(p.cost)}. Đây là số liệu thiết kế, không phải ngân sách đã chốt.</span></div><div class="info-banner">${icon('shield')}Nhân viên chỉ xem dự án của mình và dự án được chia sẻ.</div><div class="row between"><span class="small muted">Trạng thái tài khoản mẫu</span>${btn(p.status==='locked'?'Mở khóa mẫu':'Khóa tài khoản mẫu','lock-employee',p.status==='locked'?'refresh':'lock','danger',`data-id="${id}"`)}</div>`,btn('Đóng','close-modal')+btn('Lưu bản xem trước','employee-save','check','primary',`data-id="${id}"`));}
function budgetModal(){modal('Ngân sách sử dụng AI','Thiết lập giới hạn cho toàn bộ không gian làm việc.',`<div class="field"><label for="company-budget">Ngân sách tháng · USD mẫu</label><input id="company-budget" class="input" type="number" min="1" value="150"><span class="hint">Giá trị chỉ minh họa bố cục; ngân sách thật chưa được chốt.</span></div><div class="form-grid"><div class="field"><label for="warning-one">Cảnh báo lần đầu</label><select id="warning-one" class="input"><option>80% ngân sách</option><option>75% ngân sách</option></select></div><div class="field"><label for="warning-two">Cảnh báo tiếp theo</label><select id="warning-two" class="input"><option>95% ngân sách</option><option>90% ngân sách</option></select></div></div><div class="settings-row"><div><strong>Dừng lượt AI mới khi không đủ ngân sách</strong><p>Vẫn cho phép đọc và xuất hội thoại đã lưu.</p></div><span class="pill green">Luôn bật</span></div>${notice('Chi phí thực tế cần đối soát với nhà cung cấp. Lượt đang chạy và usage báo muộn có thể ảnh hưởng số dư.')}<p class="tiny muted">Prototype không thay đổi billing hoặc phát sinh chi phí.</p>`,btn('Đóng','close-modal')+btn('Xem trạng thái hết hạn mức','demo-state','','soft','data-id="budget"')+btn('Xem trước cấu hình','budget-save','check','primary'));}
function filePreview(id){const names=['Tổng quan nghiên cứu.pdf','Phản hồi khách hàng.xlsx','Ghi chú dự án.md'];modal(names[Number(id)||0],'Tài liệu mẫu · Không phải tệp được tải lên',`<div class="panel panel-padding" style="background:#fafbf7"><div class="eyebrow">NEXMO · TÀI LIỆU DỰ ÁN</div><h2 class="mt12">Khung nghiên cứu khách hàng</h2><p class="small muted mt12">Nội dung sau minh họa trải nghiệm xem tài liệu ngay trong Hub.</p><div class="divider"></div><h3>Mục tiêu nghiên cứu</h3><p class="small mt12">Hiểu vấn đề khách hàng đang gặp, cách họ giải quyết hiện tại và tiêu chí để cân nhắc một lựa chọn mới.</p><h3 class="mt24">Những câu hỏi cần làm rõ</h3><ul class="small"><li>Vấn đề xuất hiện trong tình huống nào?</li><li>Giải pháp hiện tại còn điểm gì bất tiện?</li><li>Kết quả nào sẽ tạo ra khác biệt?</li></ul><div class="divider"></div><p class="tiny muted">Tài liệu này chỉ dùng để trình bày thiết kế. Không có dữ liệu khách hàng thật.</p></div>`,btn('Đóng','close-modal','','primary'),true);}
function contextModal(id){const p=project(id);modal('Ngữ cảnh hội thoại',p.name,`<h3>Phạm vi được dùng cho lượt trao đổi</h3><div class="check-list"><div>${icon('check')}Tin nhắn trong nhánh hội thoại đang mở</div><div>${icon('check')}Tài liệu được người dùng chọn</div><div>${icon('shield')}Quyền truy cập của dự án được áp dụng</div></div><div class="divider"></div><h3>Tài liệu mẫu</h3>${['Tổng quan nghiên cứu.pdf','Phản hồi khách hàng.xlsx'].map((n,i)=>`<button class="modal-option" data-action="file-preview" data-id="${i}">${icon('file')}<span class="grow">${n}</span>${icon('eye')}</button>`).join('')}${notice('Dữ liệu dự án khác không tự được gửi kèm, kể cả khi Owner có quyền xem nhiều dự án.')}`,btn('Đóng','close-modal','','primary'));}
function dispatch(a,id,el,e){
  const handled=['guide','close-modal','workspace','search','notifications','navigate','new-project','create-project','share','share-save','quick-chat','project-chat','models','model-select','branch','branch-model','suggest','send','stop','retry','attach','file-preview','context','copy-answer','like','chat-options','export-chat','connect','provider-detail','test-connection','integration-tab','subscription','save-subscription','invite','invite-preview','employee','employee-save','lock-employee','confirm-lock','budget','budget-save','month','export-usage','import-provider','sample-file','import-next','import-back','import-reset','import-help','settings-tab','save-settings','toggle','audit-filter','forgot','forgot-preview','login-role','demo-state'];
  if(!handled.includes(a))return false;e.preventDefault();
  switch(a){
    case 'guide':guide();break;
    case 'close-modal':closeModal();break;
    case 'navigate':closeModal();S.view='normal';go(el.dataset.path);break;
    case 'workspace':modal('NexMO Workspace','Một không gian làm việc chung cho công ty.',`<div class="row">${mark()}<div><h3>Nex AI Hub</h3><p class="small muted">1 chủ doanh nghiệp · 5 nhân viên</p></div></div><div class="check-list"><div>${icon('check')}Nhân viên chỉ đăng nhập Hub</div><div>${icon('check')}Kết nối API do công ty quản lý</div><div>${icon('check')}Dữ liệu được tổ chức theo dự án</div></div>`,btn('Đóng','close-modal','','primary'));break;
    case 'search':modal('Tìm trong không gian làm việc','Chỉ tìm kiếm trong các dự án bạn được xem.',`<form id="global-search-form"><div class="input-icon">${icon('search')}<input class="input" id="global-search" autofocus placeholder="Tìm hội thoại, ý tưởng hoặc dự án..." aria-label="Từ khóa tìm kiếm"></div><div class="mt24 eyebrow">GỢI Ý GẦN ĐÂY</div>${visibleChats().slice(0,3).map(c=>`<button type="button" class="modal-option mt12" data-action="navigate" data-path="chat/${c.id}">${symbol(c.provider)}<span class="grow"><strong>${c.title}</strong><p>${project(c.project).name}</p></span>${icon('arrow')}</button>`).join('')}</form>`,btn('Đóng','close-modal'));break;
    case 'notifications':modal('Thông báo','Cập nhật trong không gian làm việc — dữ liệu mẫu',`<div class="file-row">${icon('people')}<div class="file-info"><strong>Bạn được thêm vào dự án</strong><p>Nội dung tháng 11 · Quyền đóng góp</p></div></div><div class="file-row">${icon('upload')}<div class="file-info"><strong>Đã hoàn tất bản nhập mẫu</strong><p>8 hội thoại mới · 1 nội dung cần xem lại</p></div></div><div class="file-row">${icon('shield')}<div class="file-info"><strong>Không gian làm việc được quản lý</strong><p>Chủ doanh nghiệp có quyền xem dự án công việc.</p></div></div>`,btn('Đã xem','close-modal','','primary'));break;
    case 'new-project':newProject();break;
    case 'create-project':{const form=$('#new-project-form');if(!form.reportValidity())break;const pid='demo'+(++S.demoCounter);NEX.projects.unshift({id:pid,name:$('#project-name').value.trim(),description:$('#project-description').value.trim()||'Không gian công việc mới của đội ngũ.',owner:me().id,members:[],write:[],icon:'folder',color:'green',chats:0,files:0,date:'Vừa xong',tag:$('#project-category').value,cost:0});closeModal();S.projectTab='conversations';S.view='normal';go('project/'+pid);toast('Đã tạo dự án mẫu trong phiên xem. Tải lại trang để khôi phục.');break;}
    case 'share':shareProject(id);break;
    case 'share-save':{const member=$('#share-member')?.value,p=project(id);p.write=$$('[data-member-right]').filter(el=>el.value==='Đóng góp').map(el=>el.dataset.memberRight);if(member&&!p.members.includes(member))p.members.push(member);closeModal();render();toast('Đã xem trước chia sẻ trong prototype. Không thay đổi quyền thật.');break;}
    case 'quick-chat':S.draft=$('#quick-prompt')?.value||'';S.projectId=visibleProjects().find(p=>p.owner===me().id)?.id||'p1';S.newMessages.new=[];go('chat/new');break;
    case 'project-chat':S.projectId=id;S.newMessages.new=[];S.draft='';go('chat/new');break;
    case 'models':{const c=NEX.conversations.find(c=>c.id===route()[1]);S.draft=$('#chat-prompt')?.value||'';modelPicker(!!c,c?.project||S.projectId);break;}
    case 'model-select':S.provider=id;closeModal();render();break;
    case 'branch':modelPicker(true,id);break;
    case 'branch-model':S.provider=id;S.projectId=el.dataset.project;closeModal();if(!canWrite(project(S.projectId)))S.projectId=visibleProjects().find(p=>p.owner===me().id)?.id||'p1';S.newMessages.new=[];S.draft='Tiếp tục phân tích từ hội thoại trước với một góc nhìn khác.';S.view='normal';go('chat/new');toast('Nhánh mẫu mới đã mở. Chưa gửi ngữ cảnh tới nhà cung cấp.');break;
    case 'suggest':S.draft=el.dataset.text;$('#chat-prompt').value=el.dataset.text;$('#chat-prompt').focus();break;
    case 'send':{const active=NEX.conversations.find(c=>c.id===id);if(active)S.provider=active.provider;const input=$('#chat-prompt'),text=input?.value.trim();if(!text){input?.focus();toast('Nhập một câu hỏi để xem tương tác mẫu.');break;}S.newMessages[id]??=[];S.newMessages[id].push({kind:'user',text});S.draft='';S.busy=true;render();typingTimer=setTimeout(()=>{S.busy=false;S.newMessages[id].push({kind:'ai',text:'Đây là phản hồi minh họa cho prototype.\n\nVới câu hỏi của bạn, luồng thiết kế sẽ kiểm tra quyền dự án và ngân sách, gửi ngữ cảnh được chọn tới AI, rồi lưu câu trả lời vào đúng hội thoại.\n\nBạn có thể thử chọn AI khác, tạo nhánh hoặc xem các trạng thái hết ngân sách trong mục “Các màn hình”. Không có yêu cầu nào được gửi ra ngoài.'});render();$('#chat-prompt')?.focus();},900);break;}
    case 'stop':clearTimeout(typingTimer);S.busy=false;render();toast('Đã dừng mô phỏng. Câu hỏi vẫn được giữ trong phiên xem.');break;
    case 'retry':toast('Đây là phản hồi mẫu. Bạn có thể nhập câu hỏi bên dưới để xem luồng gửi và nhận.');break;
    case 'attach':modal('Chọn tài liệu cho hội thoại','Chỉ những tài liệu được chọn mới trở thành ngữ cảnh.',`${['Tổng quan nghiên cứu.pdf','Phản hồi khách hàng.xlsx','Ghi chú dự án.md'].map((f,i)=>`<label class="modal-option"><input type="checkbox" ${i<2?'checked':''}>${icon('file')}<span class="grow">${f}</span>${pill('Tệp mẫu')}</label>`).join('')}<p class="tiny muted">Prototype không đọc hoặc tải lên tệp thật.</p>`,btn('Đóng','close-modal')+btn('Dùng tài liệu mẫu','close-modal','check','primary'));break;
    case 'file-preview':filePreview(id);break;
    case 'context':contextModal(id);break;
    case 'copy-answer':toast('Đã xem thao tác sao chép. Prototype không thay đổi clipboard của bạn.');break;
    case 'like':el.setAttribute('aria-pressed','true');el.style.color='var(--green)';toast('Đã đánh dấu hữu ích trong bản mẫu.');break;
    case 'chat-options':modal('Tùy chọn hội thoại','Các thao tác thiết kế cho kho hội thoại.',`<button class="modal-option" data-action="export-chat">${icon('download')}<span class="grow">Xem trước bản xuất</span>${icon('chevron')}</button><button class="modal-option" data-action="branch" data-id="${NEX.conversations.find(c=>c.id===id)?.project||S.projectId}">${icon('branch')}<span class="grow">Tiếp tục bằng AI khác</span>${icon('chevron')}</button>`,btn('Đóng','close-modal'));break;
    case 'export-chat':modal('Xem trước bản xuất','Hội thoại được xuất trong phạm vi quyền của bạn.',`<div class="panel panel-padding"><div class="eyebrow">NEX AI HUB · HỘI THOẠI</div><h3 class="mt12">Phân tích nghiên cứu khách hàng</h3><p class="small muted mt12">Dự án: Nghiên cứu thị trường<br>Nguồn: Claude · Dữ liệu mẫu<br>Người thực hiện: Linh Nguyễn</p><div class="divider"></div><p class="small">Bản xuất bao gồm nội dung hội thoại nhận được, nguồn, thời gian và trích dẫn có trong dữ liệu.</p></div>`,btn('Đóng bản xem trước','close-modal','','primary'));break;
    case 'connect':connectModal(id||'openai');break;
    case 'provider-detail':providerDetail(id);break;
    case 'test-connection':{const selected=$('#connect-provider').value;if(selected==='meta'){providerDetail('meta');break;}modal('Kết quả kiểm tra mẫu','Đây là trạng thái minh họa, không có yêu cầu API thật.',`<div class="success-symbol">${icon('check')}</div><div style="text-align:center"><h2>Kết nối sẵn sàng</h2><p class="small muted mt12">Mẫu phản hồi cho trường hợp credential hợp lệ và model có thể sử dụng.</p></div>`,btn('Đóng','close-modal','','primary'));break;}
    case 'integration-tab':S.integrationTab=id;render();break;
    case 'subscription':{const p=provider(id);modal('Thông tin tài khoản',p.id==='openai'?'ChatGPT':p.name,`<div class="field"><label for="subscription-plan">Gói sử dụng</label><input id="subscription-plan" class="input" value="${p.account}"></div><div class="field"><label for="subscription-owner">Người quản lý</label><input id="subscription-owner" class="input" value="Minh Trần" readonly></div><div class="field"><label for="subscription-date">Ngày gia hạn mẫu</label><input id="subscription-date" class="input" type="date" value="2026-11-18"></div>${notice('Thay đổi bản ghi trong Hub không thay đổi hoặc gia hạn gói trên nền tảng AI.')}`,btn('Hủy','close-modal')+btn('Lưu bản xem trước','save-subscription','check','primary'));break;}
    case 'save-subscription':closeModal();toast('Đã xem trước thao tác lưu. Không thay đổi thuê bao thật.');break;
    case 'invite':modal('Mời nhân viên','Nhân viên chỉ cần tài khoản Nex AI Hub.',`<form id="invite-form"><div class="field"><label for="invite-name">Họ và tên</label><input class="input" id="invite-name" placeholder="Tên nhân viên mẫu" required></div><div class="field"><label for="invite-email">Email công việc</label><input class="input" id="invite-email" type="email" placeholder="nhanvien@nexmo.example" required><span class="hint">Chỉ dùng dữ liệu mẫu. Prototype không gửi email.</span></div><div class="field"><label>Vai trò</label><div class="input">Nhân viên</div></div>${notice('Nhân viên chỉ xem dự án của mình và dự án được chia sẻ. Chủ doanh nghiệp có quyền xem mọi dự án công việc.')}</form>`,btn('Hủy','close-modal')+btn('Xem trước lời mời','invite-preview','mail','primary'));break;
    case 'invite-preview':{if(!$('#invite-form').reportValidity())break;const name=$('#invite-name').value;modal('Lời mời đã sẵn sàng','Bản xem trước — chưa gửi email.',`<div class="panel panel-padding"><h3>Chào ${esc(name)},</h3><p class="small mt12">Bạn được mời tham gia NexMO Workspace để làm việc với AI và cộng tác theo dự án.</p><div class="mt24">${btn('Tham gia không gian làm việc','navigate','arrow','primary','data-path="login"')}</div></div>`,btn('Đóng','close-modal'));break;}
    case 'employee':employeeModal(id);break;
    case 'employee-save':{const input=$('#employee-budget');if(!input.reportValidity())break;person(id).limit=Number(input.value);closeModal();render();toast('Đã cập nhật hạn mức mẫu trong phiên xem, không thay đổi ngân sách thật.');break;}
    case 'lock-employee':{const locked=person(id).status==='locked';modal(locked?'Mở khóa nhân viên mẫu':'Khóa nhân viên mẫu',person(id).name,`<p class="small">${locked?'Trong sản phẩm thật, nhân viên có thể đăng nhập và dùng lại các quyền được cấp.':'Trong sản phẩm thật, nhân viên bị thu hồi phiên và không tạo được lượt AI mới. Dự án vẫn được giữ để bàn giao.'}</p>${notice('Thao tác này chỉ mô phỏng trạng thái trên bảng nhân viên.')}`,btn('Hủy','close-modal')+btn(locked?'Mở khóa mẫu':'Khóa mẫu','confirm-lock','lock',locked?'primary':'danger',`data-id="${id}"`));break;}
    case 'confirm-lock':person(id).status=person(id).status==='locked'?'active':'locked';closeModal();render();toast('Trạng thái tài khoản mẫu đã thay đổi.');break;
    case 'budget':budgetModal();break;
    case 'budget-save':{const input=$('#company-budget');if(!input.reportValidity())break;const amount=input.value;modal('Xem trước cấu hình ngân sách','Chưa áp dụng cho tài khoản hoặc dịch vụ thật.',`<div class="definition"><div class="definition-row"><span>Ngân sách công ty</span><strong>$${esc(amount)} / tháng</strong></div><div class="definition-row"><span>Cảnh báo</span><strong>80% và 95%</strong></div><div class="definition-row"><span>Khi không đủ ngân sách</span><strong>Dừng lượt AI mới</strong></div></div>${notice('Dữ liệu báo cáo mẫu vẫn giữ nguyên để bạn so sánh các màn hình. Ngân sách triển khai thật sẽ được quyết định riêng.')}`,btn('Đóng','close-modal','','primary'));break;}
    case 'month':toast('Bộ dữ liệu thiết kế đang hiển thị tháng 11/2026.');break;
    case 'export-usage':modal('Xem trước báo cáo sử dụng','Dữ liệu minh họa · Tháng 11/2026',`<div class="table-wrap"><table class="data-table compact no-wide"><thead><tr><th>Thành viên</th><th>Chi phí mẫu</th></tr></thead><tbody>${(S.role==='owner'?NEX.people:[me()]).map(p=>`<tr><td>${p.name}</td><td>${money(p.cost)}</td></tr>`).join('')}</tbody></table></div><p class="tiny muted mt12">Sản phẩm thật sẽ xuất báo cáo theo phạm vi được phép. Prototype chỉ trình bày bản xem trước.</p>`,btn('Đóng','close-modal','','primary'));break;
    case 'import-provider':S.importProvider=id;S.importReady=false;render();break;
    case 'sample-file':S.importReady=true;render();toast('Đã chọn tệp mẫu có sẵn. Không đọc tệp trên máy.');break;
    case 'import-next':S.importStep=Math.min(3,S.importStep+1);render();window.scrollTo(0,0);break;
    case 'import-back':S.importStep=1;render();break;
    case 'import-reset':S.importStep=1;S.importReady=false;render();break;
    case 'import-help':modal('Luồng nhập hội thoại','Thiết kế nhập một chiều về Hub.',`<div class="check-list"><div>${icon('download')}Xuất dữ liệu từ tài khoản nguồn trong phạm vi được phép.</div><div>${icon('eye')}Xem trước hội thoại, tệp thiếu và bản trùng.</div><div>${icon('folder')}Chọn dự án công việc để gán dữ liệu.</div><div>${icon('check')}Kiểm tra báo cáo kết quả và nguồn gốc bản nhập.</div></div>${notice('Mức hỗ trợ phụ thuộc định dạng export thực tế. Không cam kết tự động đồng bộ mọi lịch sử.')}`,btn('Đã hiểu','close-modal','','primary'));break;
    case 'settings-tab':S.settingsTab=id;render();break;
    case 'save-settings':toast('Đã xem trước cấu hình. Không thay đổi cài đặt hệ thống thật.');break;
    case 'toggle':el.classList.toggle('on');el.setAttribute('aria-checked',String(el.classList.contains('on')));break;
    case 'audit-filter':modal('Lọc hoạt động','Thiết kế bộ lọc nhật ký.',`<div class="field"><label for="audit-actor">Người thực hiện</label><select id="audit-actor" class="input"><option>Tất cả thành viên</option>${NEX.people.map(p=>`<option>${p.name}</option>`).join('')}</select></div><div class="field"><label for="audit-action">Loại hành động</label><select id="audit-action" class="input"><option>Tất cả hành động</option><option>Xem nội dung</option><option>Thay đổi quyền</option><option>Xuất dữ liệu</option></select></div>`,btn('Đóng','close-modal')+btn('Xem bộ lọc mẫu','close-modal','filter','primary'));break;
    case 'forgot':modal('Khôi phục truy cập','Nhập email để xem trước luồng khôi phục.',`<form id="forgot-form"><div class="field"><label for="forgot-email">Email công việc</label><input id="forgot-email" class="input" type="email" value="${me().email}" required><span class="hint">Prototype không gửi email hay thay đổi mật khẩu.</span></div></form>`,btn('Quay lại','close-modal')+btn('Tiếp tục','forgot-preview','arrow','primary'));break;
    case 'forgot-preview':if(!$('#forgot-form').reportValidity())break;modal('Kiểm tra email của bạn','Trạng thái thành công minh họa.',`<div class="success-symbol">${icon('mail')}</div><p class="small">Trong sản phẩm thật, nếu địa chỉ được đăng ký, bạn sẽ nhận hướng dẫn khôi phục. Prototype không gửi email.</p>`,btn('Về đăng nhập','close-modal','','primary'));break;
    case 'login-role':S.role=id;render();break;
    case 'demo-state':S.view=id;closeModal();if(['budget','readonly'].includes(id)){S.projectId='p1';go('chat/c1');}else go('projects');render();break;
  }
  return true;
}
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='login-form'){go('overview');toast('Bạn đang xem giao diện mẫu. Không có xác thực thật.');}else if(e.target.id==='global-search-form'){S.librarySearch=$('#global-search').value;closeModal();go('library');}});
document.addEventListener('change',e=>{if(e.target.id==='library-provider'){S.libraryProvider=e.target.value;render();}if(e.target.id==='library-source'){S.librarySource=e.target.value;render();}});
document.addEventListener('input',e=>{if(e.target.id==='chat-prompt')S.draft=e.target.value;if(e.target.id==='quick-prompt')S.quickDraft=e.target.value;const mapping={'library-search':'librarySearch','employee-search':'employeeSearch'};const key=mapping[e.target.id];if(key){const elementId=e.target.id,pos=e.target.selectionStart;S[key]=e.target.value;render();const input=$('#'+elementId);input?.focus();input?.setSelectionRange(pos,pos);}});
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();dispatch('search',null,null,e);}if(e.target.id==='chat-prompt'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('[data-action="send"]')?.click();}});

</script>
<script>
/* Visual prototype only. In-memory UI states, no API calls, auth, uploads or persistence. */
const $ = (q,root=document)=>root.querySelector(q);
const $$ = (q,root=document)=>[...root.querySelectorAll(q)];
const esc = value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon = (name)=>`<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">${NEX.icons[name]||NEX.icons.file}</svg>`;
const mark=()=>'<span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 17V7h3l8 10h3V7M5 7l14 10" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>';
const S={role:'owner',view:'normal',projectTab:'conversations',projectFilter:'all',projectSearch:'',librarySearch:'',libraryProvider:'all',librarySource:'all',integrationTab:'api',provider:'claude',importProvider:'openai',importStep:1,importReady:false,settingsTab:'workspace',employeeSearch:'',newMessages:{},mobile:false,projectId:'p1',demoCounter:0};
const me=()=>NEX.people.find(p=>p.id===(S.role==='owner'?'owner':'linh'));
const person=id=>NEX.people.find(p=>p.id===id)||NEX.people[0];
const project=id=>NEX.projects.find(p=>p.id===id)||NEX.projects[0];
const provider=id=>NEX.providers.find(p=>p.id===id)||NEX.providers[0];
const canRead=p=>S.role==='owner'||p.owner===me().id||p.members.includes(me().id);
const canWrite=p=>p.owner===me().id||p.write.includes(me().id);
const visibleProjects=()=>NEX.projects.filter(canRead);
const visibleChats=()=>NEX.conversations.filter(c=>canRead(project(c.project)));
const avatar=(id,cls='')=>`<span class="avatar ${esc(id)} ${cls}" title="${esc(person(id).name)}">${esc(person(id).initials)}</span>`;
const symbol=(id,large=false)=>`<span class="provider-symbol ${esc(id)} ${large?'large':''}" aria-hidden="true">${provider(id).letter}</span>`;
const money=n=>'$'+Number(n).toFixed(2);
const pill=(text,cls='')=>`<span class="pill ${cls}">${text}</span>`;
const btn=(label,action,ic='',cls='',extra='')=>`<button class="btn ${cls}" data-action="${action}" ${extra}>${ic?icon(ic):''}${label}</button>`;
const ib=(ic,label,action,extra='')=>`<button class="icon-button" aria-label="${label}" title="${label}" data-action="${action}" ${extra}>${icon(ic)}</button>`;
const route=()=>location.hash.replace(/^#\/?/,'').split('/').filter(Boolean);
const go=path=>{if(location.hash===`#/${path}`)render();else location.hash='/'+path;};
const titles={overview:'Tổng quan',projects:'Dự án',project:'Chi tiết dự án',chat:'Hội thoại',library:'Kho hội thoại',integrations:'Nguồn AI',team:'Nhân viên',usage:'Chi phí sử dụng',imports:'Nhập dữ liệu',settings:'Cài đặt',audit:'Nhật ký hoạt động',login:'Đăng nhập'};
let toastTimer,typingTimer;
function toast(text){$('#toast').textContent=text;$('#toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),3800);}
function notice(text,type=''){return `<div class="info-banner ${type}">${icon(type==='red'||type==='amber'?'alert':'shield')}<span class="flex">${text}</span></div>`;}
function heading(title,description,actions=''){return `<div class="page-heading"><div><h1>${title}</h1><p>${description}</p></div>${actions}</div>`;}
function navLink(id,label,ic,count=''){const r=route()[0]||'overview';const active=r===id||(id==='projects'&&r==='project');return `<a class="nav-item ${active?'active':''}" href="#/${id}" ${active?'aria-current="page"':''}>${icon(ic)}<span>${label}</span>${count?`<span class="nav-count">${count}</span>`:''}</a>`;}
function sidebar(){return `<aside class="sidebar ${S.mobile?'open':''}" aria-label="Điều hướng chính"><a href="#/overview" class="brand">${mark()}<span>nex<span style="font-weight:400"> ai hub</span></span></a><button class="workspace-select" data-action="workspace"><span class="workspace-logo">N</span><span class="workspace-info text-left"><strong>NexMO Workspace</strong><br><small>Không gian công việc</small></span>${icon('down')}</button><nav><div class="nav-group"><div class="nav-label">KHÔNG GIAN LÀM VIỆC</div>${navLink('overview','Tổng quan','grid')}${navLink('projects',S.role==='owner'?'Tất cả dự án':'Dự án của tôi','folder',visibleProjects().length)}${navLink('library','Kho hội thoại','library')}</div><div class="nav-group"><div class="nav-label">${S.role==='owner'?'QUẢN TRỊ':'CÁ NHÂN'}</div>${S.role==='owner'?navLink('integrations','Nguồn AI','plug')+navLink('team','Nhân viên','people','5'):''}${navLink('usage',S.role==='owner'?'Chi phí sử dụng':'Sử dụng của tôi','chart')}${S.role==='owner'?navLink('imports','Nhập dữ liệu','upload')+navLink('audit','Nhật ký hoạt động','activity'):''}</div></nav><div class="sidebar-bottom"><div class="sidebar-budget"><div class="row between"><span class="label">Ngân sách tháng 11</span>${icon('wallet')}</div><div class="row between mt12"><strong>${S.role==='owner'?'$65.40':'$18.60'}</strong><span class="tiny muted">/ ${S.role==='owner'?'$150':'$30'}</span></div><div class="track"><span style="width:${S.role==='owner'?44:62}%"></span></div><div class="tiny muted" style="font-size:10px">Số liệu mẫu để xem giao diện</div></div>${navLink('settings','Cài đặt','settings')}<button class="nav-item full" data-action="guide">${icon('help')}<span>Hướng dẫn prototype</span></button><div class="sidebar-account">${avatar(me().id)}<div class="name"><strong>${me().name}</strong><br><small>${S.role==='owner'?'Chủ doanh nghiệp':'Nhân viên'}</small></div>${ib('logout','Xem màn hình đăng nhập','login')}</div></div></aside>`;}
function shell(content){const r=route()[0]||'overview';return `<div class="shell"><button class="mobile-scrim ${S.mobile?'open':''}" data-action="menu" aria-label="Đóng điều hướng"></button>${sidebar()}<div class="app-body"><header class="topbar"><div class="row gap6">${ib('menu','Mở điều hướng','menu','data-mobile-menu')}<div class="breadcrumbs"><span class="breadcrumb-parent">Không gian làm việc</span><span class="breadcrumb-parent">/</span><span class="current">${titles[r]||'Tổng quan'}</span></div></div><div class="top-actions"><button class="search-trigger" data-action="search" aria-label="Tìm trong không gian làm việc">${icon('search')}<span>Tìm trong không gian làm việc...</span><kbd>⌘ K</kbd></button>${ib('bell','Thông báo','notifications')}<span class="desktop-only" style="height:20px;border-left:1px solid var(--line)"></span>${avatar(me().id)}</div></header><div class="prototype-bar"><span class="prototype-label">PROTOTYPE · DỮ LIỆU MINH HỌA</span><div class="demo-controls"><label class="sr-only" for="role-select">Vai trò xem thử</label><select id="role-select" aria-label="Vai trò xem thử"><option value="owner" ${S.role==='owner'?'selected':''}>Xem: Chủ doanh nghiệp</option><option value="employee" ${S.role==='employee'?'selected':''}>Xem: Nhân viên Linh</option></select><button class="demo-link" data-action="guide">Các màn hình</button></div></div><main id="main" class="content" tabindex="-1">${content}</main></div></div>`;}
function projectCard(p){return `<a href="#/project/${p.id}" class="project-card"><div class="row between"><span class="project-icon ${p.color}">${icon(p.icon)}</span>${pill(p.tag)}</div><h3>${esc(p.name)}</h3><p>${esc(p.description)}</p><div class="project-meta"><span>${icon('chat')}${p.chats} hội thoại</span><span>${icon('file')}${p.files} tài liệu</span></div><footer><div class="avatar-group">${[p.owner,...p.members].slice(0,3).map(id=>avatar(id,'sm')).join('')}${p.members.length>2?`<span class="avatar sm">+${p.members.length-2}</span>`:''}</div><span>${p.date}</span></footer></a>`;}
function conversationRow(c,details=false){return `<a class="conversation-item" href="#/chat/${c.id}">${symbol(c.provider)}<div class="conversation-text"><div class="conversation-title">${esc(c.title)}</div><div class="conversation-sub"><span>${esc(project(c.project).name)}</span><span>·</span><span>${person(c.author).name}</span>${details?`<span>· ${c.messages} tin nhắn</span>`:''}</div></div><time>${c.time}</time>${details?icon('chevron'):''}</a>`;}
function metric(label,value,ic,sub=''){return `<div class="metric"><div class="metric-top">${icon(ic)}${label}</div><div class="metric-number">${value}${sub?`<small>${sub}</small>`:''}</div></div>`;}
function stateContent(){if(S.view==='empty')return `<div class="panel empty"><div class="empty-icon">${icon('folder')}</div><h2>Một khởi đầu mới</h2><p>Tạo dự án đầu tiên để sắp xếp ý tưởng, tài liệu và những cuộc trò chuyện với AI.</p>${btn('Tạo dự án đầu tiên','new-project','plus','primary')}${btn('Về dữ liệu mẫu','normal','','ghost')}</div>`;if(S.view==='loading')return `<div role="status" aria-label="Đang tải dữ liệu mẫu"><div class="skeleton" style="width:38%;height:30px"></div><div class="skeleton" style="width:64%"></div><div class="project-grid mt24">${[1,2,3].map(()=>'<div class="panel skeleton-card"><div class="skeleton" style="width:35%;height:30px"></div><div class="skeleton"></div><div class="skeleton" style="width:75%"></div></div>').join('')}</div><div class="mt24">${btn('Kết thúc trạng thái tải','normal','','soft')}</div></div>`;if(S.view==='error')return `<div class="panel empty"><div class="empty-icon">${icon('alert')}</div><h2>Chưa thể tải dữ liệu</h2><p>Kết nối tạm thời bị gián đoạn. Các hội thoại đã lưu của bạn vẫn được giữ nguyên.</p>${btn('Thử lại','normal','refresh','primary')}<p class="tiny">Màn hình lỗi minh họa</p></div>`;return '';}
function overview(){return `${heading(`Chào buổi sáng, ${S.role==='owner'?'Minh':'Linh'}.`,'Mọi AI, mọi dự án. Cùng một không gian làm việc.','<div class="date">Thứ Ba, 03 tháng 11, 2026</div>')}${stateContent()||`<div class="welcome-grid"><section class="start-panel"><div class="eyebrow">KHÔNG GIAN CHO Ý TƯỞNG TIẾP THEO</div><h2>Bạn muốn bắt đầu từ đâu?</h2><p>Một câu hỏi nhỏ có thể mở ra một hướng đi mới.</p><div class="quick-composer"><label for="quick-prompt" class="sr-only">Câu hỏi mới</label><textarea id="quick-prompt" placeholder="Hỏi, tìm hiểu hoặc cùng AI phát triển ý tưởng...">${esc(S.quickDraft||'')}</textarea><div class="quick-bottom"><div class="provider-choices">${NEX.providers.slice(0,3).map(p=>`<button class="provider-choice ${S.provider===p.id?'active':''}" data-action="quick-provider" data-id="${p.id}">${symbol(p.id)}${p.name}</button>`).join('')}</div><button class="send-button" data-action="quick-chat" aria-label="Bắt đầu hội thoại">${icon('up')}</button></div></div><div class="hero-foot"><span>${icon('shield')}Ngữ cảnh riêng theo dự án</span><span>${icon('check')}Hội thoại được lưu tự động</span></div></section><aside class="budget-hero"><div class="row between"><div class="eyebrow">${S.role==='owner'?'NGÂN SÁCH THÁNG 11':'HẠN MỨC CỦA BẠN'}</div>${icon('chart')}</div><div class="hero-money">${S.role==='owner'?'$84.60':'$11.40'} <small>còn lại</small></div><div class="track"><span style="width:${S.role==='owner'?44:62}%"></span></div><div class="budget-stats"><span>Đã sử dụng ${S.role==='owner'?'$65.40':'$18.60'}</span><span>${S.role==='owner'?44:62}%</span></div><a class="budget-link" href="#/usage"><span>Xem chi tiết sử dụng</span>${icon('arrow')}</a></aside></div><div class="metrics-strip">${metric('Dự án đang hoạt động',visibleProjects().length,'folder')}${metric('Hội thoại trong tháng',S.role==='owner'?'110':'74','chat','+12 tuần này')}${metric('Thành viên',S.role==='owner'?'6':'3','people',S.role==='owner'?'5 nhân viên':'dự án cộng tác')}${metric('Nguồn AI sẵn sàng','3 / 4','plug')}</div><section><div class="section-heading"><h2>Tiếp tục công việc <span>Dự án gần đây</span></h2><a class="text-link" href="#/projects">Tất cả dự án ${icon('arrow')}</a></div><div class="project-grid preview">${visibleProjects().slice(0,3).map(projectCard).join('')}</div></section><div class="bottom-grid"><section class="panel panel-padding"><div class="section-heading"><h2>Hội thoại gần đây</h2><a class="text-link" href="#/library">Xem tất cả ${icon('arrow')}</a></div>${visibleChats().slice(0,4).map(c=>conversationRow(c)).join('')}</section><aside class="panel panel-padding status-panel"><div class="section-heading"><h2>Nguồn AI</h2>${icon('plug')}</div><div class="status-list">${NEX.providers.map(p=>`<div class="provider-status-row">${symbol(p.id)}<span>${p.name}</span>${pill(p.id==='meta'?'Chờ xác minh':'Sẵn sàng',p.id==='meta'?'amber dot':'green dot')}</div>`).join('')}</div><div class="status-note">Trạng thái kết nối minh họa. Prototype chưa kết nối dịch vụ AI.</div></aside></div>`}`;}
function projectsPage(){let items=visibleProjects().filter(p=>!S.projectSearch||`${p.name} ${p.description}`.toLocaleLowerCase('vi').includes(S.projectSearch.toLocaleLowerCase('vi')));if(S.projectFilter==='mine')items=items.filter(p=>p.owner===me().id);if(S.projectFilter==='shared')items=items.filter(p=>p.owner!==me().id&&p.members.includes(me().id));return `${heading(S.role==='owner'?'Tất cả dự án':'Dự án của tôi','Sắp xếp ý tưởng và hội thoại theo từng mục tiêu công việc.',btn('Tạo dự án','new-project','plus','primary'))}${notice(S.role==='owner'?'Bạn có quyền xem toàn bộ dự án công việc trong NexMO. Quyền đóng góp được cấp riêng theo dự án.':'Dự án công việc — chủ doanh nghiệp có quyền xem nội dung. Nhân viên khác chỉ thấy khi được chia sẻ.')}<div class="toolbar"><div class="tabs">${[['all','Tất cả',visibleProjects().length],['mine','Của tôi',visibleProjects().filter(p=>p.owner===me().id).length],['shared','Được chia sẻ',visibleProjects().filter(p=>p.owner!==me().id&&p.members.includes(me().id)).length]].map(([id,name,count])=>`<button class="tab ${S.projectFilter===id?'active':''}" data-action="project-filter" data-id="${id}">${name}<span class="count">${count}</span></button>`).join('')}</div><div class="row"><div class="input-icon">${icon('search')}<input class="input" id="project-search" aria-label="Tìm dự án" placeholder="Tìm dự án..." value="${esc(S.projectSearch)}"></div></div></div>${stateContent()||(items.length?`<div class="project-grid">${items.map(projectCard).join('')}</div>`:emptySearch())}`;}
function emptySearch(){return `<div class="panel empty"><div class="empty-icon">${icon('search')}</div><h2>Chưa tìm thấy kết quả</h2><p>Thử một từ khóa khác hoặc bỏ bộ lọc để xem thêm nội dung.</p>${btn('Bỏ bộ lọc','clear-filters','refresh','soft')}</div>`;}
function denied(){return `<div class="panel empty"><div class="empty-icon">${icon('lock')}</div><h2>Bạn chưa có quyền truy cập</h2><p>Dự án này chưa được chia sẻ với bạn. Bạn có thể liên hệ chủ dự án để được cấp quyền.</p><a class="btn primary" href="#/projects">Về dự án của tôi</a></div>`;}
function projectPage(id){const p=project(id);if(!canRead(p))return denied();const writable=canWrite(p);return `${heading(esc(p.name),`Dự án của ${person(p.owner).name} · Cập nhật ${p.date.toLowerCase()}`,`<div class="row">${btn('Chia sẻ','share','people','',`data-id="${p.id}"`)}${writable?btn('Hội thoại mới','project-chat','plus','primary',`data-id="${p.id}"`):pill('Chỉ xem','blue')}</div>`)}<div class="project-detail-grid"><div><p class="project-description">${esc(p.description)}</p>${notice(writable?'Dự án công việc — chủ doanh nghiệp có quyền xem nội dung.':'Bạn đang xem dự án. Cần quyền đóng góp để tạo hoặc tiếp tục hội thoại.')}<div class="detail-tabs">${[['conversations','Hội thoại','chat'],['files','Tài liệu','file'],['members','Thành viên','people']].map(([key,label,ic])=>`<button class="detail-tab ${S.projectTab===key?'active':''}" data-action="project-tab" data-id="${key}">${icon(ic)}${label}</button>`).join('')}</div><div class="panel mt24">${S.projectTab==='conversations'?`<div class="detail-list">${NEX.conversations.filter(c=>c.project===p.id).map(c=>conversationRow(c,true)).join('')||'<div class="empty"><h3>Chưa có hội thoại</h3><p>Bắt đầu từ một câu hỏi cho dự án này.</p></div>'}</div>`:S.projectTab==='files'?`<div class="panel-padding">${['Tổng quan nghiên cứu.pdf','Phản hồi khách hàng.xlsx','Ghi chú dự án.md'].map((f,i)=>`<div class="file-row"><div class="file-icon">${icon('file')}</div><div class="file-info"><strong>${f}</strong><p>${['2.4 MB','840 KB','12 KB'][i]} · ${person(p.owner).name} · Tệp mẫu</p></div>${ib('eye','Xem tài liệu mẫu','file-preview',`data-id="${i}"`)}</div>`).join('')}</div>`:`<div class="panel-padding">${[p.owner,...p.members].map(uid=>`<div class="file-row">${avatar(uid)}<div class="file-info"><strong>${person(uid).name}</strong><p>${person(uid).email}</p></div>${pill(uid===p.owner?'Chủ dự án':p.write.includes(uid)?'Đóng góp':'Chỉ xem',uid===p.owner?'green':'')}</div>`).join('')}<div class="info-banner">${icon('eye')}Chủ doanh nghiệp luôn có quyền xem dự án công việc.</div></div>`}</div></div><aside class="panel panel-padding project-side"><h3>Thông tin dự án</h3><div class="definition"><div class="definition-row"><span>Chủ dự án</span><span class="row gap6">${avatar(p.owner,'sm')}${person(p.owner).name}</span></div><div class="definition-row"><span>Phân loại</span>${pill(p.tag)}</div><div class="definition-row"><span>Ngày tạo</span><span>20/10/2026</span></div><div class="definition-row"><span>Hội thoại</span><strong>${p.chats}</strong></div><div class="definition-row"><span>Tài liệu</span><strong>${p.files}</strong></div>${S.role==='owner'?`<div class="definition-row"><span>Chi phí mẫu</span><strong>${money(p.cost)}</strong></div>`:''}</div><div class="divider"></div><h3>AI trong dự án</h3><div class="row mt12">${NEX.providers.slice(0,3).map(pr=>symbol(pr.id)).join('')}<span class="tiny muted">3 kết nối chung</span></div><div class="divider"></div><p class="small muted">Ngữ cảnh được tách theo từng hội thoại. Chỉ tài liệu bạn chọn mới được gửi cho AI.</p></aside></div>`;}

function render(){
  const [page='overview',id]=route();
  const pages={overview,projects:projectsPage,project:()=>projectPage(id)};
  if(typeof chatPage==='function')pages.chat=()=>chatPage(id);
  if(typeof libraryPage==='function')pages.library=libraryPage;
  if(typeof integrationsPage==='function')pages.integrations=integrationsPage;
  if(typeof teamPage==='function')pages.team=teamPage;
  if(typeof usagePage==='function')pages.usage=usagePage;
  if(typeof importsPage==='function')pages.imports=importsPage;
  if(typeof settingsPage==='function')pages.settings=settingsPage;
  if(typeof auditPage==='function')pages.audit=auditPage;
  const adminOnly=['integrations','team','imports','audit'];
  let content=S.role!=='owner'&&adminOnly.includes(page)?denied():pages[page]?pages[page]():`${heading(titles[page]||'Prototype','Màn hình này đang được hoàn thiện trong bản xem trước.')}<div class="panel empty"><div class="empty-icon">${icon('edit')}</div><h2>Đang dựng giao diện chi tiết</h2><p>Bạn có thể xem Tổng quan và Dự án trong lúc các màn hình khác được hoàn thiện.</p><a class="btn primary" href="#/overview">Về tổng quan</a></div>`;
  $('#app').innerHTML=page==='login'&&typeof loginPage==='function'?loginPage():shell(content);
  document.title=`${titles[page]||'Prototype'} · Nex AI Hub`;
}
window.addEventListener('hashchange',()=>{S.mobile=false;if(route()[1]!=='new')S.draft='';render();window.scrollTo(0,0);});
document.addEventListener('click',e=>{
  if(e.target.closest('.skip-link')){e.preventDefault();$('#main')?.focus();return;}
  const el=e.target.closest('[data-action]');if(!el)return;
  const a=el.dataset.action,id=el.dataset.id;
  if(typeof dispatch==='function'&&dispatch(a,id,el,e))return;
  if(a==='menu'){S.mobile=!S.mobile;render();}
  else if(a==='project-tab'){S.projectTab=id;render();}
  else if(a==='project-filter'){S.projectFilter=id;render();}
  else if(a==='quick-provider'){S.quickDraft=$('#quick-prompt')?.value||'';S.provider=id;render();}
  else if(a==='login')go('login');
  else if(a==='normal'){S.view='normal';render();}
  else if(a==='clear-filters'){S.projectSearch='';S.projectFilter='all';S.librarySearch='';S.libraryProvider='all';S.librarySource='all';render();}
  else toast('Thao tác này đang hiển thị ở chế độ xem trước.');
});
document.addEventListener('change',e=>{if(e.target.id==='role-select'){S.role=e.target.value;S.view='normal';S.draft='';render();}});
document.addEventListener('input',e=>{if(e.target.id==='project-search'){const value=e.target.value,pos=e.target.selectionStart;S.projectSearch=value;render();const input=$('#project-search');input.focus();input.setSelectionRange(pos,pos);}});
render();

</script>
</body>
</html>
